# Render Blueprint: free web service built from the Dockerfile.
# Render sets PORT; the app listens on it (see backend/config.py).
# Free tier: sleeps after ~15 min idle. Without DATABASE_URL, data/ (paper trades, accounts) resets on each
# restart or deploy; with DATABASE_URL (a Neon project used ONLY by AI Traded) everything is kept.
#
# Private beta login (backend/auth.py). Set the two "sync: false" values in Render -> ai-traded -> Environment:
#   TRADER_INVITE_CODE  the code friends type on "Create account"
#   TRADER_USERS        optional fixed accounts that survive restarts, e.g.  yourname:long-password
# If neither is set, the hosted site stays locked.
#
# Email for sign-up codes and "forgot password" (backend/mailer.py). Set ONE option in Render -> Environment:
#   Gmail made just for AI Traded: SMTP_HOST=smtp.gmail.com SMTP_PORT=465 SMTP_USER=<gmail> SMTP_PASS=<app password>
#   Resend with a verified domain:  RESEND_API_KEY=re_...  MAIL_FROM="AI Traded <no-reply@your-domain>"
services:
  - type: web
    name: ai-traded
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: TRADER_BACKGROUND_UNIVERSE
        value: nifty100
      - key: TRADER_SECRET_KEY
        generateValue: true
      - key: TRADER_INVITE_CODE
        sync: false
      - key: TRADER_USERS
        sync: false
      - key: DATABASE_URL
        sync: false
