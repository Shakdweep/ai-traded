# Render Blueprint: free web service built from the Dockerfile.
# Render sets PORT; the app listens on it (see backend/config.py).
# Free tier: sleeps after ~15 min idle, and data/ (paper trades) resets on each restart or deploy.
services:
  - type: web
    name: ai-traded
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: TRADER_BACKGROUND_UNIVERSE
        value: nifty100
